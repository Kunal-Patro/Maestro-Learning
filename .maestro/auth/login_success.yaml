appId: org.wikipedia
name: Login succeeds with valid credentials
tags:
  - auth
  - regression
  - requires-network
onFlowComplete:
  - runFlow: ../common/teardown/logout.yaml
---
# WIKI_USER / WIKI_PASS must be passed at runtime with -e. Never commit them.
- runFlow:
    file: "../common/setup/login_as_user.yaml"
- tapOn:
    id: "nav_tab_more"
- assertVisible:
    id: "main_drawer_account_name"
    text: ${WIKI_USER}
- assertVisible:
    id: "main_drawer_watchlist_container"
- assertNotVisible:
    id: "main_drawer_login_button"
